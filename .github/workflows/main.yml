name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - run: mvn -B package
      - uses: actions/upload-artifact@v5
        with:
          name: GawharaTickets
          path: target/GawharaTickets.jar
