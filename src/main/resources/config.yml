# ===== GawharaStatus 1.1 =====
# بيبعت رسالة واحدة في روم ديسكورد وبيعدّلها نفسها (مش بيعمل رسايل جديدة).
# الحالات: 🟢 أونلاين | 🟠 بيترستر | 🔴 أوفلاين

discord:
  # Webhook الروم العلنية: إعدادات الروم > Integrations > Webhooks > New Webhook > Copy Webhook URL
  webhook-url: ""
  username: "GawharaSMP Status"
  avatar-url: ""
  # صورة صغيرة فوق يمين الرسالة. لو فاضية وuse-server-icon=true بتتجاب أيقونة السيرفر لوحدها.
  thumbnail-url: ""
  use-server-icon: true
  # بانر كبير تحت الرسالة (اختياري)
  image-url: ""

# ربط لوحة التحكم (Pterodactyl) عشان CPU/RAM/Disk الحقيقيين ومدة التشغيل.
# API Key: صورتك فوق يمين اللوحة > API Credentials > Create. سيبه "" لو مش عايز الربط.
# مهم: الـ Key زي الباسورد، متبعتوش لحد.
panel:
  url: "https://tickhosting.com"
  server-id: "77de1f91"
  api-key: ""
  show-disk: true

server-name: "GawharaSMP"

# عنوان Java اللي بيدخل بيه اللاعبين
java-ip: "gawharasmp.tkmc.net"
# عنوان بديل يتعرض تحت (لو الدومين وقع). سيبه "" لو مش عايزه.
java-backup-address: "node-de-free-01.tickhosting.com:51008"

# Bedrock: لو الاستضافة مفيهاش بورت UDP خليها false والسطر هيختفي
bedrock-enabled: true
bedrock-ip: "gawharasmp.tkmc.net"
bedrock-port: 51008

# كل كام ثانية يحدّث الرسالة (أقل حاجة 15). التحديث بيحصل فوراً كمان لما حد يدخل/يخرج.
update-interval-seconds: 30

show-tps: true
show-mspt: true
show-version: true
# رام الجافا واستهلاك المعالج
show-resources: true
# من إمتى السيرفر شغال
show-uptime: true
# أعلى عدد لاعبين النهارده
show-peak: true
# يعرض أسماء اللي جوا السيرفر
show-player-names: false

# لو true: أي إيقاف للسيرفر (stop) يتعرض "بيترستر" بدل "أوفلاين".
# مفيد لو الاستضافة بتعمل Restart عن طريق stop (زرار الريستارت في اللوحة).
treat-stop-as-restart: false

texts:
  title-online: "🟢 {server} — أونلاين"
  title-restarting: "🟠 {server} — بيترستر"
  title-offline: "🔴 {server} — أوفلاين"
  desc-online: "السيرفر شغال وتقدر تدخل دلوقتي ✅"
  desc-restarting: "السيرفر بيترستر دلوقتي، استنى دقيقة وارجع 🔄"
  desc-offline: "السيرفر مقفول حالياً ❌"
  status-online: "✅ شغال"
  status-restarting: "🔄 بيترستر"
  status-offline: "❌ مقفول"
  f-status: "الحالة"
  f-players: "👥 اللاعبين"
  f-performance: "⚡ الأداء"
  f-resources: "📊 الموارد"
  crash-notice: "⚠️ رجع بعد وقوف مفاجئ، آخر مرة كان شغال:"
  f-version: "🎮 الإصدار"
  f-uptime: "⏱️ شغال من"
  f-peak: "🏆 أعلى عدد النهارده"
  f-last-seen: "🕒 آخر مرة شغال"
  f-java: "☕ Java"
  f-bedrock: "📱 Bedrock"
  f-names: "🧑‍🤝‍🧑 اللي جوا السيرفر"
  bedrock-address: "العنوان"
  bedrock-port: "البورت"
  backup-label: "↪ عنوان بديل:"
  updated-prefix: "🕒 آخر تحديث:"
  footer: "لو آخر تحديث قديم أكتر من دقيقتين، يبقى السيرفر واقف"
